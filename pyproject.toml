[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-ssl-tracker"
version = "0.1.0"
description = "Enterprise TLS/SSL certificate expiration tracker and Certificate Transparency monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Logihertz Systems OPC Pvt Ltd" }
]
keywords = ["ssl", "tls", "x509", "certificate-transparency", "security", "audit"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]

[project.scripts]
lh-ssl = "lh_ssl_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_ssl_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
