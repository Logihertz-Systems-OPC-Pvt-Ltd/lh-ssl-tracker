[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-ssl-tracker"
version = "0.1.0"
description = "Audits live TLS endpoints, local X.509 PEM certificate bundles, and Certificate Transparency (crt.sh) feeds for imminent SLA expirations, weak RSA/ECC keys, SHA-1/MD5 signatures, SAN mismatches, and rogue shadow subdomains."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "tls-security",
    "ssl-certificate",
    "certificate-transparency",
    "x509",
    "pki-audit",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-ssl-tracker"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-ssl-tracker"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-ssl-tracker#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-ssl-tracker/issues"

[project.scripts]
lh-ssl = "lh_ssl_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_ssl_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
